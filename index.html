<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Котость Таппер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; }
        
        #aura-bg { position: fixed; top: -15%; left: -15%; width: 130%; height: 130%; z-index: -1; transition: background 1.5s ease-in-out; animation: auraExplosion 2.5s infinite cubic-bezier(0.15, 0.5, 0.3, 1); pointer-events: none; }
        #top-header { position: fixed; top: 30px; font-size: 24px; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.6); z-index: 10; }
        #score { font-size: 60px; font-weight: 900; color: #ffcc00; margin: 0; text-shadow: 0 0 40px rgba(255, 204, 0, 0.4); z-index: 10; margin-top: -40px; }
        
        #cat-wrapper { position: relative; z-index: 20; width: 85vw; max-width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
        #cat-image { width: 90%; height: auto; pointer-events: none; transition: filter 0.5s ease; }

        /* Стили кнопок */
        .side-btn { position: fixed; bottom: 25px; z-index: 100; width: 60px; height: 60px; cursor: pointer; transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; background: rgba(25, 25, 25, 0.9); border: 2px solid rgba(255, 204, 0, 0.3); border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.5); overflow: hidden; }
        .side-btn:active { transform: scale(0.9); }
        .side-btn img { width: 75%; height: 75%; object-fit: contain; }

        /* Расположение кнопок */
        #settings-btn { left: 20px; font-size: 26px; }
        #shop-btn { right: 90px; } /* Обычный магазин чуть левее */
        #skin-shop-btn { right: 20px; } /* Скин шоп самый крайний справа */

        /* Меню */
        .overlay-menu { position: fixed; bottom: -100%; left: 0; width: 100%; height: 75vh; background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(15px); border-top: 3px solid #ffcc00; border-top-left-radius: 30px; border-top-right-radius: 30px; z-index: 200; transition: bottom 0.4s cubic-bezier(0.32, 1, 0.23, 1); padding: 30px; text-align: center; }
        .overlay-menu.open { bottom: 0; }
        .overlay-menu h2 { font-size: 26px; color: #ffcc00; margin-bottom: 25px; text-transform: uppercase; }

        .option-row { background: #1a1a1a; border: 1px solid #333; color: white; padding: 18px; width: 100%; border-radius: 15px; margin-bottom: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .option-row.active { border-color: #ffcc00; background: #332b00; }
        .close-btn { background: #ff4444; color: white; border: none; padding: 12px 45px; border-radius: 12px; font-weight: bold; margin-top: 15px; text-transform: uppercase; }

        /* Эффекты */
        .tapped { animation: clickJump 0.1s ease-out; }
        @keyframes clickJump { 0% { transform: scale(1); } 50% { transform: scale(0.92); } 100% { transform: scale(1); } }
        @keyframes auraExplosion { 0% { transform: scale(0.95); opacity: 0.4; } 12% { transform: scale(1.15); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
        .tap-effect { position: fixed; color: #ffcc00; font-size: 42px; font-weight: 900; pointer-events: none; z-index: 150; text-shadow: 0 0 15px rgba(255, 204, 0, 0.8); animation: plusOne 0.6s ease-out forwards; }
        @keyframes plusOne { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-150px) scale(1.4); opacity: 0; } }
        
        #error-msg { display: none; text-align: center; color: #ff4444; padding: 20px; z-index: 1000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; }
    </style>
</head>
<body>

    <div id="error-msg">
        <h1 style="margin-top: 50vh; transform: translateY(-50%);">❌ ОШИБКА ID<br><small style="font-size: 16px; color: #666;">Запустите через Котость Бота</small></h1>
    </div>

    <audio id="bg-music" loop><source src="song.mp3" type="audio/mpeg"></audio>

    <div id="top-header">Тапай Котость!</div>
    <div id="aura-bg"></div>
    <h1 id="score">...</h1>

    <div id="cat-wrapper">
        <img id="cat-image" src="image_0.png" alt="Котость">
    </div>

    <div id="settings-btn" class="side-btn" onclick="toggleMenu('settings-menu', true)">⚙️</div>
    
    <div id="shop-btn" class="side-btn" onclick="toggleMenu('shop-menu', true)">
        <img src="shop_new.png" alt="Shop">
    </div>

    <div id="skin-shop-btn" class="side-btn" onclick="toggleMenu('skin-shop-menu', true)">
        <img src="skinshop.png" alt="Skin Shop">
    </div>

    <div id="shop-menu" class="overlay-menu">
        <h2>Улучшения</h2>
        <div style="padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 20px;">
            <span style="color: #ffcc00; font-size: 14px;">БАЛАНС:</span> <br>
            <span class="current-balance" style="font-size: 32px; font-weight: 900;">0</span>
        </div>
        <div class="option-row">Скоро добавление бустов...</div>
        <button class="close-btn" onclick="toggleMenu('shop-menu', false)">ЗАКРЫТЬ</button>
    </div>

    <div id="skin-shop-menu" class="overlay-menu">
        <h2>Магазин скинов</h2>
        <div style="padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 20px;">
            <span style="color: #ffcc00; font-size: 14px;">БАЛАНС:</span> <br>
            <span class="current-balance" style="font-size: 32px; font-weight: 900;">0</span>
        </div>
        <div class="option-row">Скины в разработке...</div>
        <button class="close-btn" onclick="toggleMenu('skin-shop-menu', false)">ЗАКРЫТЬ</button>
    </div>

    <div id="settings-menu" class="overlay-menu">
        <h2>Настройки</h2>
        <div id="music-opt" class="option-row" onclick="toggleMusic()">🎵 Музыка: ВЫКЛ</div>
        <div id="name-opt" class="option-row" onclick="toggleCurrency()">🔄 Валюта: Котость</div>
        <button class="close-btn" onclick="toggleMenu('settings-menu', false)">ЗАКРЫТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const firebaseConfig = {
            apiKey: "AIzaSyAxBcWDZ3FF2Bzmcj3piDj0QFF-TmYP8pg",
            authDomain: "kotostaptap.firebaseapp.com",
            databaseURL: "https://kotostaptap-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotostaptap",
            storageBucket: "kotostaptap.firebasestorage.app",
            messagingSenderId: "339821671767",
            appId: "1:339821671767:web:b1bee939a4c5de23d9ba12"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const user = tg.initDataUnsafe?.user;
        if (!user || !user.id) {
            document.getElementById('error-msg').style.display = 'block';
            throw new Error("User ID not found");
        }

        const userId = user.id;
        const username = user.username || user.first_name || 'игрок';
        const userRef = database.ref('users/' + userId);

        let score = 0;
        let isCookieMode = false;
        let musicActive = false;
        let isLoaded = false;

        const music = document.getElementById('bg-music');
        const scoreDisplay = document.getElementById('score');
        const balances = document.querySelectorAll('.current-balance');
        const tapper = document.getElementById('cat-wrapper');
        const headerText = document.getElementById('top-header');

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                score = data.score || 0;
                isCookieMode = data.isCookie || false;
                musicActive = data.musicOn || false;
                if (!isLoaded) { isLoaded = true; applySettingsVisuals(); }
                updateVisuals();
            } else {
                userRef.set({ score: 0, isCookie: false, musicOn: false, username: username });
            }
        });

        function updateVisuals() {
            scoreDisplay.innerText = score.toLocaleString();
            balances.forEach(b => b.innerText = score.toLocaleString());
            const accentColor = isCookieMode ? "#ff9500" : "#0082ff";
            document.getElementById('aura-bg').style.background = `radial-gradient(circle at center bottom, ${accentColor} 0%, rgba(0, 0, 0, 0) 80%)`;
            document.getElementById('cat-image').style.filter = `drop-shadow(0 0 35px ${accentColor})`;
        }

        function applySettingsVisuals() {
            const mBtn = document.getElementById('music-opt');
            if (musicActive) { mBtn.innerText = "🎵 Музыка: ВКЛ"; mBtn.classList.add('active'); }
            const nBtn = document.getElementById('name-opt');
            headerText.innerText = isCookieMode ? "Тапай Куки!" : "Тапай Котость!";
            nBtn.innerText = isCookieMode ? "🔄 Валюта: Куки" : "🔄 Валюта: Котость";
        }

        function handleTap(x, y) {
            if (!isLoaded) return;
            score++;
            updateVisuals();
            userRef.update({ score: score, username: username });
            tapper.classList.remove('tapped');
            void tapper.offsetWidth; 
            tapper.classList.add('tapped');
            if (musicActive && music.paused) music.play().catch(() => {});
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            spawnPlusOne(x, y);
        }

        tapper.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, { passive: false });

        tapper.addEventListener('mousedown', (e) => { handleTap(e.clientX, e.clientY); });

        function toggleMusic() {
            musicActive = !musicActive;
            const btn = document.getElementById('music-opt');
            if (musicActive) { music.play().catch(() => {}); btn.innerText = "🎵 Музыка: ВКЛ"; btn.classList.add('active'); }
            else { music.pause(); btn.innerText = "🎵 Музыка: ВЫКЛ"; btn.classList.remove('active'); }
            userRef.update({ musicOn: musicActive });
        }

        function toggleCurrency() {
            isCookieMode = !isCookieMode;
            applySettingsVisuals();
            updateVisuals();
            userRef.update({ isCookie: isCookieMode });
        }

        function toggleMenu(id, open) {
            document.getElementById(id).classList.toggle('open', open);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function spawnPlusOne(x, y) {
            const el = document.createElement('div');
            el.className = 'tap-effect';
            el.innerText = '+1';
            el.style.left = `${x - 20}px`; el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }
    </script>
</body>
</html>
