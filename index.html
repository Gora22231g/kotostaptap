<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Котость Таппер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; transition: background-color 2s ease; }
        
        #aura-bg { position: fixed; top: -15%; left: -15%; width: 130%; height: 130%; z-index: -1; transition: background 2s; animation: auraExplosion 2.5s infinite; pointer-events: none; }
        #score { font-size: 60px; font-weight: 900; color: #ffcc00; z-index: 10; margin-top: -40px; text-shadow: 0 0 30px rgba(255, 204, 0, 0.4); }
        
        #cat-wrapper { position: relative; z-index: 50; width: 80vw; max-width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #cat-image { width: 90%; height: auto; pointer-events: none; }

        .side-btn { position: fixed; bottom: 25px; z-index: 100; width: 65px; height: 65px; cursor: pointer; }
        .side-btn img { width: 100%; border-radius: 15px; }

        .overlay-menu { position: fixed; bottom: -110%; left: 0; width: 100%; height: 70vh; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-top: 3px solid #ffcc00; z-index: 200; transition: 0.4s; padding: 20px; text-align: center; border-radius: 30px 30px 0 0; }
        .overlay-menu.open { bottom: 0; }
        
        #warn-screen, #ban-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #warn-screen { background: rgba(255, 100, 0, 0.95); color: white; }
        #ban-screen { background: #000; color: #ff4444; border: 5px solid #ff4444; }

        .tapped { animation: clickJump 0.1s ease-out; }
        @keyframes clickJump { 0% { transform: scale(1); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }
        @keyframes auraExplosion { 0% { opacity: 0.4; } 50% { opacity: 0.7; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="warn-screen"><h1>⚠️ ПРЕДУПРЕЖДЕНИЕ</h1><p id="warn-text" style="font-size: 24px;"></p></div>
    <div id="ban-screen"><h1>🚫 ДОСТУП ОГРАНИЧЕН</h1><p>Вы заблокированы администратором или системой.</p><h2 id="ban-timer"></h2></div>

    <audio id="bg-music" loop><source src="song.mp3" type="audio/mpeg"></audio>
    <div id="score">0</div>
    <div id="aura-bg"></div>

    <div id="cat-wrapper"><img id="cat-image" src="image_0.png"></div>

    <div style="left:20px;" class="side-btn" onclick="toggleMenu('settings-menu', true)"><img src="settings_icon.png"></div>
    <div style="right:20px;" class="side-btn" onclick="toggleMenu('skin-menu', true)"><img src="skinshop.png"></div>

    <script>
        const ADMIN_ID = 5242142630;
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const firebaseConfig = {
            apiKey: "AIzaSyAxBcWDZ3FF2Bzmcj3piDj0QFF-TmYP8pg",
            authDomain: "kotostaptap.firebaseapp.com",
            databaseURL: "https://kotostaptap-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotostaptap",
            storageBucket: "kotostaptap.firebasestorage.app",
            messagingSenderId: "339821671767",
            appId: "1:339821671767:web:b1bee939a4c5de23d9ba12"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const user = tg.initDataUnsafe?.user || { id: 0 };
        const userRef = database.ref('users/' + user.id);

        let score = 0, warnCount = 0, banUntil = 0, clickHistory = [];
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const LIMIT = isMobile ? 15 : 6;

        userRef.on('value', (snap) => {
            const data = snap.val();
            if (data) {
                score = data.score || 0;
                warnCount = data.warnCount || 0;
                banUntil = data.banUntil || 0;
                checkBan();
                document.getElementById('score').innerText = score.toLocaleString();
            } else {
                userRef.set({ score: 0, warnCount: 0, banUntil: 0 });
            }
        });

        function checkBan() {
            const now = Date.now();
            const screen = document.getElementById('ban-screen');
            if (banUntil > now) {
                screen.style.display = 'flex';
                const diff = banUntil - now;
                const h = Math.floor(diff/3600000);
                const m = Math.floor((diff%3600000)/60000);
                const s = Math.floor((diff%60000)/1000);
                document.getElementById('ban-timer').innerText = `Осталось: ${h}ч ${m}м ${s}с`;
            } else {
                screen.style.display = 'none';
            }
        }

        function handleTap(x, y) {
            if (banUntil > Date.now()) return;
            
            const now = Date.now();
            clickHistory.push(now);
            clickHistory = clickHistory.filter(t => now - t < 1000);

            if (clickHistory.length > LIMIT) {
                warnCount++;
                if (warnCount >= 4) {
                    userRef.update({ banUntil: Date.now() + 3600000, warnCount: 0 });
                } else {
                    userRef.update({ warnCount: warnCount });
                    document.getElementById('warn-text').innerText = `Предупреждение ${warnCount}/3`;
                    document.getElementById('warn-screen').style.display = 'flex';
                    setTimeout(() => document.getElementById('warn-screen').style.display = 'none', 2000);
                }
                clickHistory = [];
                return;
            }

            score++;
            userRef.update({ score: score });
            if (score % 5000 === 0) document.body.style.backgroundColor = `hsl(${Math.random()*360}, 20%, 10%)`;
            
            tg.HapticFeedback.impactOccurred('light');
        }

        document.getElementById('cat-wrapper').addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap(e.touches[0].clientX, e.touches[0].clientY);
        });
        document.getElementById('cat-wrapper').addEventListener('mousedown', (e) => handleTap(e.clientX, e.clientY));
        function toggleMenu(id, open) { document.getElementById(id).classList.toggle('open', open); }
    </script>
</body>
</html>
