<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Котость Таппер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; }
        
        #aura-bg { position: fixed; top: -15%; left: -15%; width: 130%; height: 130%; z-index: -1; transition: background 1.5s ease-in-out; animation: auraExplosion 2.5s infinite cubic-bezier(0.15, 0.5, 0.3, 1); pointer-events: none; }
        #top-header { position: fixed; top: 30px; font-size: 24px; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.6); z-index: 10; }
        #score { font-size: 60px; font-weight: 900; color: #ffcc00; margin: 0; text-shadow: 0 0 40px rgba(255, 204, 0, 0.4); z-index: 10; margin-top: -40px; }
        
        #cat-wrapper { position: relative; z-index: 50; width: 85vw; max-width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; }
        #cat-image { width: 90%; height: auto; pointer-events: none; transition: filter 0.5s ease; }

        .side-btn { position: fixed; bottom: 25px; z-index: 100; width: 65px; height: 65px; cursor: pointer; transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; background: none; border: none; }
        .side-btn img { width: 100%; height: 100%; object-fit: contain; border-radius: 18px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .side-btn:active { transform: scale(0.9); }

        #settings-btn { left: 20px; font-size: 42px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #shop-btn { right: 100px; }
        #skin-shop-btn { right: 20px; }

        /* ОБНОВЛЕННОЕ ВЫДВИЖНОЕ МЕНЮ */
        .overlay-menu { 
            position: fixed; 
            bottom: -100%; 
            left: 0; 
            width: 100%; 
            height: 100vh; 
            background: rgba(10, 10, 10, 0.98); 
            backdrop-filter: blur(25px); 
            border-top: 3px solid #ffcc00; 
            border-radius: 30px 30px 0 0;
            z-index: 200; 
            transition: transform 0.4s cubic-bezier(0.17, 0.84, 0.44, 1); 
            padding: 15px 30px 40px; 
            text-align: center; 
            touch-action: none; /* Управляем через JS */
        }
        
        .overlay-menu.open { transform: translateY(-75%); } /* По умолчанию открыто на 75% */
        .overlay-menu.full { transform: translateY(-100%); } /* На весь экран */

        /* Ручка для перетаскивания */
        .drag-handle { width: 50px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 20px; cursor: grab; }

        /* Контейнер для контента со скроллом */
        .menu-content { 
            height: calc(100% - 40px); 
            overflow-y: auto; 
            padding-bottom: 50px;
            -webkit-overflow-scrolling: touch; 
        }

        .option-row { background: #1a1a1a; border: 1px solid #333; color: white; padding: 18px; width: 100%; border-radius: 15px; margin-bottom: 12px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .option-row:active { transform: scale(0.98); background: #252525; }
        
        .buy-btn { background: #ffcc00; color: black; border: none; padding: 8px 15px; border-radius: 10px; font-weight: 900; }
        .close-btn { background: #ff4444; color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; margin-top: 10px; text-transform: uppercase; width: 100%; }

        .tapped { animation: clickJump 0.1s ease-out; }
        @keyframes clickJump { 0% { transform: scale(1); } 50% { transform: scale(0.92); } 100% { transform: scale(1); } }
        @keyframes auraExplosion { 0% { transform: scale(0.95); opacity: 0.4; } 12% { transform: scale(1.15); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
        
        .tap-effect { position: fixed; color: #ffcc00; font-size: 42px; font-weight: 900; pointer-events: none; z-index: 150; animation: plusOne 0.6s ease-out forwards; }
        @keyframes plusOne { 0% { transform: translateY(0) opacity: 1; } 100% { transform: translateY(-150px) opacity: 0; } }
        #error-msg { display: none; text-align: center; color: #ff4444; position: fixed; width: 100%; height: 100%; background: #050505; z-index: 1000; }
    </style>
</head>
<body>

    <div id="error-msg"><h1>❌ ОШИБКА ID</h1></div>
    <audio id="bg-music" loop><source src="song.mp3" type="audio/mpeg"></audio>

    <div id="top-header">Тапай Котость!</div>
    <div id="aura-bg"></div>
    <h1 id="score">0</h1>

    <div id="cat-wrapper">
        <img id="cat-image" src="image_0.png" alt="Котость">
    </div>

    <div id="settings-btn" class="side-btn" onclick="openMenu('settings-menu')">⚙️</div>
    <div id="shop-btn" class="side-btn" onclick="openMenu('shop-menu')"><img src="shop_new.png"></div>
    <div id="skin-shop-btn" class="side-btn" onclick="openMenu('skin-shop-menu')"><img src="skinshop.png"></div>

    <div id="skin-shop-menu" class="overlay-menu">
        <div class="drag-handle"></div>
        <div class="menu-content">
            <h2>Магазин скинов</h2>
            <div style="padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 20px;">
                <span style="color: #ffcc00;">БАЛАНС:</span> <span class="current-balance">0</span>
            </div>
            <div class="option-row" onclick="buyOrSelect('skin0')">
                <div style="display:flex; align-items:center;"><img src="image_0.png" width="40" style="margin-right:10px;"> Дефолт</div>
                <div id="btn-skin0" class="buy-btn">ВЫБРАТЬ</div>
            </div>
            <div class="option-row" onclick="buyOrSelect('skin1')">
                <div style="display:flex; align-items:center;"><img src="skin1.png" width="40" style="margin-right:10px;"> Элитный (+2)</div>
                <div id="btn-skin1" class="buy-btn">1,000</div>
            </div>
            <div class="option-row" onclick="buyOrSelect('skin2')">
                <div style="display:flex; align-items:center;"><img src="skin2.png" width="40" style="margin-right:10px;"> Куки дино (+3)</div>
                <div id="btn-skin2" class="buy-btn">5,000</div>
            </div>
            <button class="close-btn" onclick="closeMenu('skin-shop-menu')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="shop-menu" class="overlay-menu">
        <div class="drag-handle"></div>
        <div class="menu-content">
            <h2>Улучшения</h2>
            <div class="option-row">Скоро...</div>
            <button class="close-btn" onclick="closeMenu('shop-menu')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="settings-menu" class="overlay-menu">
        <div class="drag-handle"></div>
        <div class="menu-content">
            <h2>Настройки</h2>
            <div class="option-row" onclick="toggleMusic()">
                <span>🎵 Музыка</span> <span id="music-status">ВЫКЛ</span>
            </div>
            <div class="option-row" onclick="toggleCurrency()">
                <span>🔄 Валюта</span> <span id="currency-status">Котость</span>
            </div>
            <button class="close-btn" onclick="closeMenu('settings-menu')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const firebaseConfig = {
            apiKey: "AIzaSyAiFyGNrCsvEhGsJybSNa0hOd7SbKT2K_o",
            authDomain: "kotostaptap.firebaseapp.com",
            databaseURL: "https://kotostaptap-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotostaptap",
            storageBucket: "kotostaptap.firebasestorage.app",
            messagingSenderId: "339821671767",
            appId: "1:339821671767:web:b1bee939a4c5de23d9ba12"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const user = tg.initDataUnsafe?.user;
        if (!user) { document.getElementById('error-msg').style.display='block'; throw ""; }

        const userRef = database.ref('users/' + user.id);
        let score = 0, isCookieMode = false, musicActive = false, ownedSkins = { skin0: true }, currentSkinId = 'skin0';

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                score = data.score || 0; isCookieMode = data.isCookie || false;
                musicActive = data.musicOn || false; ownedSkins = data.ownedSkins || { skin0: true };
                currentSkinId = data.currentSkinId || 'skin0';
                updateVisuals(); renderShop(); renderSettings();
            } else {
                userRef.set({ score: 0, isCookie: false, musicOn: false, ownedSkins: { skin0: true }, currentSkinId: 'skin0' });
            }
        });

        // ЛОГИКА ПЕРЕТАСКИВАНИЯ МЕНЮ (Swipe up/down)
        let startY = 0;
        let currentActiveMenu = null;

        function openMenu(id) {
            currentActiveMenu = document.getElementById(id);
            currentActiveMenu.classList.add('open');
            currentActiveMenu.classList.remove('full');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function closeMenu(id) {
            const menu = document.getElementById(id);
            menu.classList.remove('open', 'full');
            currentActiveMenu = null;
        }

        document.querySelectorAll('.overlay-menu').forEach(menu => {
            menu.addEventListener('touchstart', e => {
                // Если мы скроллим контент внутри, не мешаем жесту, пока мы не на самом верху
                if (menu.querySelector('.menu-content').scrollTop > 0) return;
                startY = e.touches[0].clientY;
            });

            menu.addEventListener('touchmove', e => {
                if (menu.querySelector('.menu-content').scrollTop > 0) return;
                let moveY = e.touches[0].clientY;
                let diff = startY - moveY;

                if (diff > 50) menu.classList.add('full'); // Тянем вверх -> во весь экран
                if (diff < -100) closeMenu(menu.id); // Тянем вниз -> закрываем
            });
        });

        // Добавляем поддержку колесика мыши для ПК
        document.querySelectorAll('.menu-content').forEach(content => {
            content.addEventListener('wheel', (e) => {
                if (e.deltaY < -30 && content.scrollTop <= 0) {
                    content.parentElement.classList.add('full');
                }
            });
        });

        function updateVisuals() {
            document.getElementById('score').innerText = score.toLocaleString();
            document.querySelectorAll('.current-balance').forEach(b => b.innerText = score.toLocaleString());
            let skinImg = (currentSkinId === 'skin1') ? 'skin1.png' : (currentSkinId === 'skin2' ? 'skin2.png' : 'image_0.png');
            document.getElementById('cat-image').src = skinImg;
            document.getElementById('top-header').innerText = isCookieMode ? "Тапай Куки!" : "Тапай Котость!";
            const accentColor = isCookieMode ? "#ff9500" : "#0082ff";
            document.getElementById('aura-bg').style.background = `radial-gradient(circle at center bottom, ${accentColor} 0%, rgba(0, 0, 0, 0) 80%)`;
            document.getElementById('cat-image').style.filter = `drop-shadow(0 0 35px ${accentColor})`;
        }

        function renderSettings() {
            document.getElementById('music-status').innerText = musicActive ? "ВКЛ" : "ВЫКЛ";
            document.getElementById('currency-status').innerText = isCookieMode ? "Куки" : "Котость";
        }

        function renderShop() {
            const skins = [{id:'skin0', p:0}, {id:'skin1', p:1000}, {id:'skin2', p:5000}];
            skins.forEach(s => {
                const btn = document.getElementById('btn-' + s.id);
                if (btn) {
                    if (ownedSkins[s.id]) {
                        btn.innerText = (currentSkinId === s.id) ? "ВЫБРАНО" : "ВЫБРАТЬ";
                        btn.style.background = (currentSkinId === s.id) ? "#0082ff" : "#44ff44";
                    } else {
                        btn.innerText = s.p.toLocaleString();
                        btn.style.background = "#ffcc00";
                    }
                }
            });
        }

        function buyOrSelect(skinId) {
            if (ownedSkins[skinId]) {
                currentSkinId = skinId;
                userRef.update({ currentSkinId: skinId });
            } else {
                const prices = { skin1: 1000, skin2: 5000 };
                if (score >= prices[skinId]) {
                    score -= prices[skinId];
                    ownedSkins[skinId] = true;
                    userRef.update({ score: score, ownedSkins: ownedSkins, currentSkinId: skinId });
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        }

        function toggleMusic() {
            musicActive = !musicActive;
            const audio = document.getElementById('bg-music');
            if (musicActive) audio.play().catch(()=>{}); else audio.pause();
            userRef.update({ musicOn: musicActive });
        }

        function toggleCurrency() {
            isCookieMode = !isCookieMode;
            userRef.update({ isCookie: isCookieMode });
        }

        function handleTap(x, y) {
            if (currentActiveMenu) return;
            let plus = (currentSkinId === 'skin1') ? 2 : (currentSkinId === 'skin2' ? 3 : 1);
            score += plus;
            updateVisuals();
            userRef.update({ score: score });
            
            const tapper = document.getElementById('cat-wrapper');
            tapper.classList.remove('tapped');
            void tapper.offsetWidth;
            tapper.classList.add('tapped');
            
            tg.HapticFeedback.impactOccurred('light');
            spawnPlusOne(x, y, plus);
        }

        function spawnPlusOne(x, y, val) {
            const el = document.createElement('div');
            el.className = 'tap-effect';
            el.innerText = '+' + val;
            el.style.left = `${x - 20}px`; el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        document.getElementById('cat-wrapper').addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, { passive: false });

        document.getElementById('cat-wrapper').addEventListener('mousedown', (e) => {
            handleTap(e.clientX, e.clientY);
        });
    </script>
</body>
</html>
