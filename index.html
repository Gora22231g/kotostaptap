<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Котость Таппер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; transition: background-color 2s ease; }
        #aura-bg { position: fixed; top: -15%; left: -15%; width: 130%; height: 130%; z-index: -1; transition: background 1.5s ease-in-out; animation: auraExplosion 2.5s infinite cubic-bezier(0.15, 0.5, 0.3, 1); pointer-events: none; }
        #top-header { position: fixed; top: 30px; font-size: 24px; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.6); z-index: 10; }
        #score { font-size: 60px; font-weight: 900; color: #ffcc00; margin: 0; text-shadow: 0 0 40px rgba(255, 204, 0, 0.4); z-index: 10; margin-top: -40px; }
        #cat-wrapper { position: relative; z-index: 50; width: 85vw; max-width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; }
        #cat-image { width: 90%; height: auto; pointer-events: none; transition: filter 0.5s ease; }
        .side-btn { position: fixed; bottom: 25px; z-index: 100; width: 65px; height: 65px; cursor: pointer; transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; background: none; border: none; }
        .side-btn img { width: 100%; height: 100%; object-fit: contain; border-radius: 18px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .overlay-menu { position: fixed; bottom: -110%; left: 0; width: 100%; height: 75vh; background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(15px); border-top: 3px solid #ffcc00; border-top-left-radius: 30px; border-top-right-radius: 30px; z-index: 200; transition: bottom 0.4s cubic-bezier(0.32, 1, 0.23, 1); padding: 30px; text-align: center; }
        .overlay-menu.open { bottom: 0; }
        .option-row { background: #1a1a1a; border: 1px solid #333; color: white; padding: 18px; width: 100%; border-radius: 15px; margin-bottom: 12px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .buy-btn { background: #ffcc00; color: black; border: none; padding: 8px 15px; border-radius: 10px; font-weight: 900; }
        .close-btn { background: #ff4444; color: white; border: none; padding: 12px 45px; border-radius: 12px; font-weight: bold; margin-top: 15px; text-transform: uppercase; }
        .tapped { animation: clickJump 0.1s ease-out; }
        @keyframes clickJump { 0% { transform: scale(1); } 50% { transform: scale(0.92); } 100% { transform: scale(1); } }
        @keyframes auraExplosion { 0% { transform: scale(0.95); opacity: 0.4; } 12% { transform: scale(1.15); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
        .tap-effect { position: fixed; color: #ffcc00; font-size: 42px; font-weight: 900; pointer-events: none; z-index: 150; animation: plusOne 0.6s ease-out forwards; }
        @keyframes plusOne { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-150px) scale(1.4); opacity: 0; } }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="song.mp3" type="audio/mpeg"></audio>
    <div id="top-header">Тапай Котость!</div>
    <div id="aura-bg"></div>
    <h1 id="score">0</h1>

    <div id="cat-wrapper"><img id="cat-image" src="image_0.png"></div>

    <div id="settings-btn" class="side-btn" onclick="toggleMenu('settings-menu', true)">⚙️</div>
    <div id="shop-btn" class="side-btn" onclick="toggleMenu('shop-menu', true)"><img src="shop_new.png"></div>
    <div id="skin-shop-btn" class="side-btn" onclick="toggleMenu('skin-shop-menu', true)"><img src="skinshop.png"></div>

    <div id="skin-shop-menu" class="overlay-menu">
        <h2>Скины</h2>
        <div class="option-row" onclick="buyOrSelect('skin0')"><span>Дефолт</span><div id="btn-skin0" class="buy-btn">ВЫБРАТЬ</div></div>
        <div class="option-row" onclick="buyOrSelect('skin1')"><span>Элитный (+2)</span><div id="btn-skin1" class="buy-btn">1,000</div></div>
        <button class="close-btn" onclick="toggleMenu('skin-shop-menu', false)">ЗАКРЫТЬ</button>
    </div>

    <div id="settings-menu" class="overlay-menu">
        <h2>Настройки</h2>
        <div class="option-row" onclick="toggleMusic()">🎵 Музыка: <span id="music-status">ВЫКЛ</span></div>
        <div class="option-row" onclick="toggleCurrency()">🔄 Валюта: <span id="currency-status">Котость</span></div>
        <button class="close-btn" onclick="toggleMenu('settings-menu', false)">ЗАКРЫТЬ</button>
    </div>

    <script>
        // Функция для расшифровки ключа «на лету»
        const _0x4f2a = (s) => atob(s);

        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const firebaseConfig = {
            // гаддемнсшейн
            apiKey: _0x4f2a("QUl6YVN5QjY5dGpWRnBjYzRUQUQ2bXRKaVVnSi0xNXFuT29DVVZv"),
            authDomain: "kotostaptap.firebaseapp.com",
            databaseURL: "https://kotostaptap-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotostaptap",
            storageBucket: "kotostaptap.firebasestorage.app",
            messagingSenderId: "339821671767",
            appId: "1:339821671767:web:b1bee939a4c5de23d9ba12"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const user = tg.initDataUnsafe?.user || { id: "test_user" };
        const userRef = database.ref('users/' + user.id);

        let score = 0, isCookieMode = false, musicActive = false, ownedSkins = { skin0: true }, currentSkinId = 'skin0';

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                score = data.score || 0;
                isCookieMode = data.isCookie || false;
                musicActive = data.musicOn || false;
                ownedSkins = data.ownedSkins || { skin0: true };
                currentSkinId = data.currentSkinId || 'skin0';
                updateVisuals();
                renderShop();
                renderSettings();
            } else {
                userRef.set({ score: 0, isCookie: false, musicOn: false, ownedSkins: { skin0: true }, currentSkinId: 'skin0' });
            }
        });

        function updateVisuals() {
            document.getElementById('score').innerText = score.toLocaleString();
            document.getElementById('cat-image').src = (currentSkinId === 'skin1') ? 'skin1.png' : 'image_0.png';
            document.getElementById('top-header').innerText = isCookieMode ? "Тапай Куки!" : "Тапай Котость!";
            const accentColor = isCookieMode ? "#ff9500" : "#0082ff";
            document.getElementById('aura-bg').style.background = `radial-gradient(circle at center bottom, ${accentColor} 0%, rgba(0, 0, 0, 0) 80%)`;
            
            // Плавная смена фона каждые 5000 валюты
            if (score > 0 && score % 5000 === 0) {
                document.body.style.backgroundColor = `hsl(${Math.random() * 360}, 25%, 10%)`;
            }
        }

        function handleTap(x, y) {
            if (document.querySelector('.overlay-menu.open')) return;
            const plus = (currentSkinId === 'skin1') ? 2 : 1;
            score += plus;
            updateVisuals();
            userRef.update({ score: score });
            
            const tapper = document.getElementById('cat-wrapper');
            tapper.classList.remove('tapped');
            void tapper.offsetWidth;
            tapper.classList.add('tapped');
            
            if (musicActive) document.getElementById('bg-music').play().catch(()=>{});
            tg.HapticFeedback.impactOccurred('light');
            spawnPlusOne(x, y, plus);
        }

        function spawnPlusOne(x, y, val) {
            const el = document.createElement('div');
            el.className = 'tap-effect';
            el.innerText = '+' + val;
            el.style.left = `${x - 20}px`; el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function renderSettings() {
            document.getElementById('music-status').innerText = musicActive ? "ВКЛ" : "ВЫКЛ";
            document.getElementById('currency-status').innerText = isCookieMode ? "Куки" : "Котость";
        }

        function renderShop() {
            const s1 = document.getElementById('btn-skin1');
            const s0 = document.getElementById('btn-skin0');
            if (ownedSkins.skin1) {
                s1.innerText = (currentSkinId === 'skin1') ? "ВЫБРАНО" : "ВЫБРАТЬ";
                s1.style.background = (currentSkinId === 'skin1') ? "#0082ff" : "#44ff44";
            }
            s0.innerText = (currentSkinId === 'skin0') ? "ВЫБРАНО" : "ВЫБРАТЬ";
            s0.style.background = (currentSkinId === 'skin0') ? "#0082ff" : "#44ff44";
        }

        function buyOrSelect(skinId) {
            if (ownedSkins[skinId]) {
                currentSkinId = skinId;
                userRef.update({ currentSkinId: skinId });
            } else if (score >= 1000) {
                score -= 1000;
                ownedSkins[skinId] = true;
                userRef.update({ score: score, ownedSkins: ownedSkins, currentSkinId: skinId });
            }
        }

        function toggleMusic() { musicActive = !musicActive; userRef.update({ musicOn: musicActive }); }
        function toggleCurrency() { isCookieMode = !isCookieMode; userRef.update({ isCookie: isCookieMode }); }
        function toggleMenu(id, open) { document.getElementById(id).classList.toggle('open', open); }

        document.getElementById('cat-wrapper').addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, { passive: false });

        document.getElementById('cat-wrapper').addEventListener('mousedown', (e) => handleTap(e.clientX, e.clientY));
    </script>
</body>
</html>
